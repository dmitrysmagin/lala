[sdl]
fullscreen=false
autolock=false
[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=auto
cputype=auto
cycles=max
[mixer]
nosound=false
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=49716
[dos]
xms=false
ems=true
umb=false
[autoexec]
mount c ./bin
c:
set BLASTER=A220 I7 D1 H5 T6
lala.exe --autoplay
exit
